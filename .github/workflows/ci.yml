name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:          # ADDED: gives you a "Run workflow" button (your sonarqube job already checks for it)

concurrency:
  group: ci-${{ github.ref }}
  # Only cancel superseded PR runs. Cancelling a run on main can kill update-manifest mid-deploy;
  # queued main runs instead run in order, so the newest image is always the last one written.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build

  # ---------- Stage 2: SonarQube scan on your laptop (self-hosted runner) ----------
  sonarqube:
    name: 2 - SonarQube scan and quality gate (local server)
    needs: [lint, test]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, sonar-local]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # FIXED: the coverage report is created here, in the same job. The old
      # "download-artifact coverage-report" step failed because no job ever uploaded that artifact.
      - run: npm run test:coverage
      - name: Check that the coverage report exists
        run: ls -l coverage/lcov.info
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: http://localhost:9000
        # FIXED: no projectBaseDir. Your code is at the repo root (src/, public/, test/), not in an app/ folder.
        with:
          args: -Dsonar.qualitygate.wait=true

  docker-build-scan-push:
    needs: [build, sonarqube]
    # ADDED: sonarqube is skipped on pull requests, so allow "skipped" but never "failed".
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.sonarqube.result == 'success' || needs.sonarqube.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      # CHANGED: Docker Hub instead of ghcr.io. The name is built from a secret, so it is NOT passed
      # through job outputs (GitHub masks secret values in outputs). Your username must be lowercase.
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/gha-cicd-demo:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@master   # pin to a release tag or commit SHA (check the Marketplace)
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push'
        run: docker push "$IMAGE"

  # CHANGED: points at YOUR fork, and opens + merges a pull request instead of pushing to main.
  update-manifest:
    needs: docker-build-scan-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.DEPLOY_PAT }}        # fine-grained token for YOUR fork (Contents + Pull requests: read and write)
      GH_REPO: sumitsingh2rmga/gha-cicd-demo-manifests
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/gha-cicd-demo:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sumitsingh2rmga/gha-cicd-demo-manifests
          token: ${{ secrets.DEPLOY_PAT }}
      - name: Open and merge a pull request that bumps the development image
        run: |
          BRANCH="ci/development-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          sed -i -E "s|(image:[[:space:]]*)[^[:space:]]*gha-cicd-demo[^[:space:]]*|\1${IMAGE}|" development/deployment.yaml
          if git diff --quiet; then
            echo "No manifest change, skipping."
            exit 0
          fi
          git add development/deployment.yaml
          git commit -m "chore: deploy development gha-cicd-demo@${GITHUB_SHA}"
          git push --force -u origin "$BRANCH"
          PR_URL="$(gh pr create --base main --head "$BRANCH" \
            --title "development: deploy ${GITHUB_SHA::7}" \
            --body "Automated image bump from the app repo CI (commit ${GITHUB_SHA}).")"
          echo "Pull request: $PR_URL" | tee -a "$GITHUB_STEP_SUMMARY"
          gh pr merge "$PR_URL" --squash
          git push origin --delete "$BRANCH" || true