# Local SonarQube: no organisation line (that setting exists only for SonarQube Cloud)
sonar.projectKey=gha-cicd-demo
sonar.projectName=gha-cicd-demo
# The scan runs with app/ as the base directory (projectBaseDir: app in ci.yml)
sonar.sources=.
sonar.inclusions=**/*.py
sonar.exclusions=test_*.py,coverage.xml
sonar.tests=.
sonar.test.inclusions=test_*.py
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml